# GeoDomeLab continuous integration.
#
# Runs every test, the verification suite, the hand-calculation validation
# and (when openseespy installs and imports) the OpenSees cross-check, on
# Ubuntu and Windows with Python 3.11 and 3.12.  One command does it all:
#
#     python run_all_checks.py
#
# Qt runs offscreen, so no display is needed.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.os }}, Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      PYTHONIOENCODING: utf-8

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the system libraries for Qt and OpenSees (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            fonts-dejavu-core libblas3 liblapack3 libgfortran5

      - name: Install the Python requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check that the package installs and the command runs
        run: |
          python -m pip install --no-deps -e .
          geodomelab --version
          python -m geodome --help

      # openseespy has no wheel for some platform / Python pairs.  Without it
      # the OpenSees tests and the cross-check are skipped, not failed.
      - name: Install OpenSeesPy (optional)
        continue-on-error: true
        run: python -m pip install openseespy

      # The bridge runs OpenSees in this interpreter ("in-process") whenever
      # openseespy imports.  This step only reports what it found.
      - name: Report how OpenSees will run
        continue-on-error: true
        run: >
          python -c "from geodome import opensees_bridge as ob;
          print('OpenSees mode:', ob.opensees_status()['mode'] or 'not found');
          print('in-process:', ob.inprocess_available())"

      - name: Run all checks
        run: python run_all_checks.py
