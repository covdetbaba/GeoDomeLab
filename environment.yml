# Conda environment for GeoDomeLab.
#
#     conda env create -f environment.yml
#     conda activate geodomelab
#     python run_geodome.py
#
# The Qt binding is PyQt6 from pip, the same one the CI tests use.
#
# Optional, for the OpenSees cross-check (validation/opensees_crosscheck.py):
#
#     pip install openseespy
#
# Everything else works without it.

name: geodomelab
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy>=1.23
  - scipy>=1.9
  - matplotlib-base>=3.6
  - qtpy>=2.0
  - pip
  - pip:
      - PyQt6>=6.4
